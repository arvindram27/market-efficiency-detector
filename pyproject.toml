[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-efficiency-detector"
version = "0.1.0"
description = "Market Efficiency Detector (MED) — Price Adjustment Latency (PAL) vertical slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["med*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
